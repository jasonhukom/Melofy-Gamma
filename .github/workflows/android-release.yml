name: Build & Release Lyra Melofy (EXE, APK & Web)

on:
  push:
    branches:
      - feat/desktop-exe-and-ytm-apps
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-web:
    name: Test Web Backend & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run Django system checks and tests
        working-directory: ./backend
        run: |
          python manage.py check
          python manage.py test

      - name: Package Web Release Zip
        run: |
          mkdir -p dist
          zip -r dist/Lyra-Melofy-web.zip backend -x "backend/__pycache__/*" "backend/**/__pycache__/*" "backend/*.sqlite3" "backend/.env"

      - name: Upload Web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Melofy-Web
          path: dist/Lyra-Melofy-web.zip
          if-no-files-found: error

  build-apk:
    name: Build Lyra Melofy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests & Build APKs
        working-directory: ./android
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Lyra-Melofy-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Lyra-Melofy-debug.apk
          ls -lh dist/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Melofy-APKs
          path: dist/*.apk
          if-no-files-found: error

  build-exe:
    name: Build Lyra Melofy Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm install --foreground-scripts

      - name: Run Desktop smoke tests
        working-directory: ./desktop
        run: npm run test:smoke

      - name: Build Windows Portable & Setup EXE
        working-directory: ./desktop
        run: npm run build

      - name: Upload EXE build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Melofy-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Create or Update GitHub Release
    needs: [test-web, build-apk, build-exe]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          name: "Lyra Melofy ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }} (Windows EXE, Android APK & Web)"
          body: |
            ## Lyra Melofy — Cross-Platform Release (`.exe`, `.apk`, Web)

            Built from commit `${{ github.sha }}` (`${{ github.ref_name }}`).

            ### Downloads
            - **`Lyra-Melofy-Portable-1.1.0.exe`** — Standalone portable Windows `.exe` (no installer required)
            - **`Lyra-Melofy-Setup-1.1.0.exe`** — Windows installer `.exe` (Start Menu & Desktop shortcuts)
            - **`Lyra-Melofy-release.apk`** — Signed Android APK (Android 8.0+ / API 26+) with built-in keyless YouTube Music
            - **`Lyra-Melofy-debug.apk`** — Android Debug APK for testing
            - **`Lyra-Melofy-web.zip`** — Django Web App + SPA source bundle
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            release-assets/*.exe
            release-assets/*.apk
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
