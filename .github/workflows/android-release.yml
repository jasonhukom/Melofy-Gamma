name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Lyra Melofy APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug and Signed Release APKs
        working-directory: ./android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifacts for Release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Lyra-Melofy-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Lyra-Melofy-debug.apk
          ls -lh dist/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Melofy-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Lyra Melofy v1.0.0 (Android APK)"
          body: |
            ## Lyra Melofy — Android APK Release

            Automated Android `.apk` build generated by GitHub Actions from commit `${{ github.sha }}`.

            ### Downloads
            - **`Lyra-Melofy-release.apk`** — Signed release APK (recommended for installation on Android 8.0+ / API 26+)
            - **`Lyra-Melofy-debug.apk`** — Debug APK for testing and inspection
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            dist/Lyra-Melofy-release.apk
            dist/Lyra-Melofy-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
