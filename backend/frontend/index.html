<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Melofy Gamma</title>
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<link rel="icon" type="image/png" href="{% static 'icons/favicon-32.png' %}" sizes="32x32">
<link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'site.webmanifest' %}">
<meta name="theme-color" content="#0A0905">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/variables.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/layout.css' %}">
<link rel="stylesheet" href="{% static 'css/components.css' %}">
<link rel="stylesheet" href="{% static 'css/player.css' %}">
</head>
<body>

<div class="app-shell">
  <main class="main-content" id="main-content"></main>
</div>

<!-- Persistent Bottom Footer (Mini Player + 5-Button Android Bottom Navbar) -->
<div class="bottom-bar-container" id="bottom-bar-container">
  <div id="player-bar-root"></div>

  <nav class="bottom-nav-bar" id="mobile-tabbar" aria-label="Bottom Navigation">
    <!-- 1. Home Tab -->
    <a class="bottom-nav-item nav-link active" href="#/" data-route="/" id="btn-nav-home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span class="nav-label">Home</span>
    </a>

    <!-- 2. Trending Tab (Sixteenth Note Icon matching SixteenthNoteView) -->
    <a class="bottom-nav-item nav-link" href="#/trending" data-route="/trending" id="btn-nav-trending">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="6.7" cy="18.7" r="2.9"/>
        <circle cx="17.3" cy="16.3" r="2.9"/>
        <rect x="7.8" y="5.2" width="1.9" height="13.5"/>
        <rect x="18.4" y="2.8" width="1.9" height="13.5"/>
        <polygon points="7.8,5.2 20.3,2.8 20.3,5.0 7.8,7.4"/>
        <polygon points="7.8,8.3 20.3,5.9 20.3,7.9 7.8,10.3"/>
      </svg>
      <span class="nav-label">Trending</span>
    </a>

    <!-- 3. Center Circular Search Tab (Bigger 62px Button) -->
    <a class="bottom-nav-center" href="#/search" data-route="/search" id="btn-nav-search" aria-label="Search">
      <div class="search-circle-container" id="container-search-circle">
        <svg class="search-center-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-4.2-4.2"/>
        </svg>
      </div>
    </a>

    <!-- 4. Downloads Tab (Full Solid White Download Icon) -->
    <a class="bottom-nav-item nav-link" href="#/downloads" data-route="/downloads" id="btn-nav-download">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      <span class="nav-label">Downloads</span>
    </a>

    <!-- 5. Profile Tab (Anonymous Avatar Silhouette / Dynamic User Avatar) -->
    <a class="bottom-nav-item nav-link" href="#/profile" data-route="/profile" id="btn-nav-profile">
      <svg class="nav-icon" id="icon-nav-profile-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <img class="nav-avatar-img" id="icon-nav-profile-img" src="" alt="Profile" style="display:none;">
      <span class="nav-label">Profile</span>
    </a>
  </nav>
</div>

<!-- Full Player Dialog Overlay (matching dialog_full_player.xml) -->
<div class="full-player-dialog" id="full-player-dialog" aria-hidden="true"></div>

<!-- Hidden YouTube IFrame Mount -->
<div id="yt-hidden-wrap" style="position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden;pointer-events:none;">
  <div id="yt-player-mount"></div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="{% static 'js/storage.js' %}" defer></script>
<script src="{% static 'js/ui.js' %}" defer></script>
<script src="{% static 'js/player.js' %}" defer></script>
<script src="{% static 'js/router.js' %}" defer></script>
<script src="{% static 'js/sidebar.js' %}" defer></script>
<script src="{% static 'js/soundMixer.js' %}" defer></script>
<script src="{% static 'js/playerbar.js' %}" defer></script>
<script src="{% static 'js/youtubeApi.js' %}" defer></script>
<script src="{% static 'js/views/home.js' %}" defer></script>
<script src="{% static 'js/views/search.js' %}" defer></script>
<script src="{% static 'js/views/library.js' %}" defer></script>
<script src="{% static 'js/views/liked.js' %}" defer></script>
<script src="{% static 'js/views/playlist.js' %}" defer></script>
<script type="module" src="{% static 'js/firebaseAuth.js' %}"></script>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
