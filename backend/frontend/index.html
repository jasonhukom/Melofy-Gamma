<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lyra Melofy — Music</title>
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<link rel="icon" type="image/png" href="{% static 'icons/favicon-32.png' %}" sizes="32x32">
<link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'site.webmanifest' %}">
<meta name="theme-color" content="#030303">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/variables.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/layout.css' %}">
<link rel="stylesheet" href="{% static 'css/components.css' %}">
<link rel="stylesheet" href="{% static 'css/player.css' %}">
</head>
<body class="sidebar-open">

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<header class="topbar" id="topbar">
  <div class="topbar-left">
    <button id="menu-btn" class="icon-btn topbar-menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg>
    </button>
    <a href="#/" class="ytm-brand" aria-label="Lyra Melofy Home">
      <span class="ytm-logo-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="#FF0033"/>
          <circle cx="12" cy="12" r="6.4" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
          <polygon points="10.2,9.1 15.4,12 10.2,14.9" fill="#FFFFFF"/>
        </svg>
      </span>
      <span class="topbar-title">Music</span>
      <span class="topbar-brand-sub">Lyra Melofy</span>
    </a>
  </div>

  <div class="topbar-center">
    <div class="ytm-search-box" id="topbar-search-box">
      <span class="ytm-search-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </span>
      <input
        type="text"
        id="topbar-search-input"
        class="ytm-search-input"
        placeholder="Search songs, albums, artists, podcasts"
        autocomplete="off"
      >
      <button type="button" id="topbar-search-clear" class="icon-btn ytm-search-clear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>

  <div class="topbar-right">
    <button type="button" class="icon-btn topbar-cast-btn" aria-label="Connect device" title="YouTube Music Connected">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
    </button>
    <div id="topbar-account" class="topbar-account"></div>
  </div>
</header>

<aside class="sidebar open" id="sidebar">
  <nav class="sidebar-nav">
    <a class="nav-link" href="#/" data-route="/">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10l-8-7z"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-link" href="#/trending" data-route="/trending">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5.5-2.5l7.51-3.49L17.5 6.5 9.99 9.99 6.5 17.5zm5.5-6.6c.61 0 1.1.49 1.1 1.1s-.49 1.1-1.1 1.1-1.1-.49-1.1-1.1.49-1.1 1.1-1.1z"/></svg>
      <span>Explore</span>
    </a>
    <a class="nav-link" href="#/library" data-route="/library">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 5h-3v5.5a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1 2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2z"/></svg>
      <span>Library</span>
    </a>
    <a class="nav-link" href="#/search" data-route="/search">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </a>
  </nav>

  <div class="sidebar-divider"></div>

  <div class="sidebar-section">
    <button id="create-playlist-btn" class="ytm-new-playlist-btn" aria-label="Create playlist" onclick="openCreatePlaylistModal()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>New playlist</span>
    </button>

    <div class="sidebar-playlists-wrap">
      <a class="sidebar-playlist-link nav-link" href="#/liked" data-route="/liked">
        <div class="sidebar-playlist-meta">
          <span class="sidebar-playlist-title">Liked Music</span>
          <span class="sidebar-playlist-sub">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
            Auto playlist
          </span>
        </div>
      </a>
      <div id="sidebar-playlists"></div>
    </div>
  </div>

  <div class="sidebar-account" id="sidebar-account"></div>
</aside>

<div class="app-shell" id="app-shell">
  <div class="ytm-ambient-glow" aria-hidden="true"></div>
  <main class="main-content" id="main-content"></main>
</div>

<div class="sound-mixer" id="sound-mixer">
  <div class="sound-mixer-panel" id="sound-mixer-panel">
    <span class="sound-mixer-value" id="sound-mixer-value">80</span>
    <input class="sound-mixer-slider" id="sound-mixer-slider" type="range" min="0" max="100" value="80">
  </div>
  <button class="sound-mixer-btn" id="sound-mixer-btn" aria-label="Sound mixer"></button>
</div>

<div id="player-bar-root"></div>

<nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Mobile Navigation">
  <a class="tab-link nav-link" href="#/" data-route="/">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="tab-label-home">Home</span>
  </a>
  <a class="tab-link nav-link" href="#/trending" data-route="/trending">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <circle cx="6.7" cy="18.7" r="2.9"/>
      <circle cx="17.3" cy="16.3" r="2.9"/>
      <rect x="7.8" y="5.2" width="1.9" height="13.5"/>
      <rect x="18.4" y="2.8" width="1.9" height="13.5"/>
      <polygon points="7.8,5.2 20.3,2.8 20.3,5.0 7.8,7.4"/>
      <polygon points="7.8,8.3 20.3,5.9 20.3,7.9 7.8,10.3"/>
    </svg>
    <span>Explore</span>
  </a>
  <a class="tab-link-search nav-link" href="#/search" data-route="/search" aria-label="Search">
    <span class="mobile-search-circle" id="mobile-search-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </span>
  </a>
  <a class="tab-link nav-link" href="#/library" data-route="/library">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 5h-3v5.5a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1 2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2z"/></svg>
    <span>Library</span>
  </a>
  <a class="tab-link nav-link" href="#/profile" data-route="/profile">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>Profile</span>
  </a>
</nav>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="{% static 'js/storage.js' %}" defer></script>
<script src="{% static 'js/ui.js' %}" defer></script>
<script src="{% static 'js/player.js' %}" defer></script>
<script src="{% static 'js/router.js' %}" defer></script>
<script src="{% static 'js/sidebar.js' %}" defer></script>
<script src="{% static 'js/soundMixer.js' %}" defer></script>
<script src="{% static 'js/playerbar.js' %}" defer></script>
<script src="{% static 'js/youtubeApi.js' %}" defer></script>
<script src="{% static 'js/views/home.js' %}" defer></script>
<script src="{% static 'js/views/search.js' %}" defer></script>
<script src="{% static 'js/views/library.js' %}" defer></script>
<script src="{% static 'js/views/liked.js' %}" defer></script>
<script src="{% static 'js/views/playlist.js' %}" defer></script>
<script type="module" src="{% static 'js/firebaseAuth.js' %}"></script>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
